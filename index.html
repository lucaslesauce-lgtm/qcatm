<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf2f4">
<title>QCATM Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,300&display=swap">
<style>
/* Layout: one question per screen, fixed header with gauge, fixed bottom bar with Précédent / Suivant */
:root{
  --bg:#edf2f4; --surface:#ffffff; --ink:#13232d; --muted:#586a76; --line:#d2dce1;
  --accent:#0a5d78; --accent-ink:#ffffff; --sel:#e0f0f5; --warn:#8a4b00; --warn-bg:#fcefd6; --ok:#17744a; --gauge:#c9d6dc;
  --font-display:'Roboto Condensed','Roboto',Arial,sans-serif; --font-body:'Roboto',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1920; --surface:#13252e; --ink:#e5eef2; --muted:#92a6b1; --line:#294450; --accent:#52bcd9; --accent-ink:#04202a; --sel:#16394a; --warn:#f3b95a; --warn-bg:#352a12; --ok:#58c58f; --gauge:#25404c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1920; --surface:#13252e; --ink:#e5eef2; --muted:#92a6b1; --line:#294450; --accent:#52bcd9; --accent-ink:#04202a; --sel:#16394a; --warn:#f3b95a; --warn-bg:#352a12; --ok:#58c58f; --gauge:#25404c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
button{font:inherit;color:inherit}
header.top{flex:none;padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:center;gap:14px;min-height:30px;position:relative}
.logos{display:flex;align-items:center;gap:14px}
.logos img{display:block;height:24px;width:auto}
.logos img.enim{height:26px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logos img{filter:invert(1) brightness(1.15)}}
:root[data-theme="dark"] .logos img{filter:invert(1) brightness(1.15)}
.brandrow .chip{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.15;letter-spacing:.02em;margin:10px 0 0;text-align:center}
.chip{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:3px 8px;border-radius:3px;white-space:nowrap}
.gauge{height:8px;background:var(--gauge);border-radius:4px;margin-top:10px;overflow:hidden}
.gauge>i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .25s ease}
.gaugelabel{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;padding:20px 16px 24px;-webkit-overflow-scrolling:touch}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1,h2{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h1{font-size:28px;margin-bottom:12px}
h1.oneline{white-space:nowrap;font-size:24px;margin:0 0 16px}
.lead.intro{margin:0 0 14px;font-size:15px}
h2{font-size:24px}
.sub{color:var(--muted);font-style:italic;margin:0 0 12px}
.lead{color:var(--muted);margin:0 0 20px}
.stack{display:flex;flex-direction:column;gap:10px}
.sector{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;min-height:76px;cursor:pointer}
.sector:active{border-color:var(--accent)}
.sector .nm{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1}
.sector .ds{font-size:13px;color:var(--muted);margin-top:3px}
.sector .arr{margin-left:auto;color:var(--accent);flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label,.legend{font-weight:500;font-size:15px}
.field .hint{font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[inputmode=numeric]{width:100%;font:inherit;font-size:18px;padding:12px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:50px}
input:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;padding:6px 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sectitle{font-family:var(--font-display);font-weight:700;font-size:17px;margin:22px 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;min-height:50px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--sel)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:4px;margin-top:1px;display:grid;place-items:center;background:var(--surface)}
.opt.radio .box{border-radius:50%}
.opt input:checked + .box{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.radio input:checked + .box::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--accent-ink);transform:none}
.num{flex:none;width:20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:3px;text-align:right}
.txt{min-width:0;font-size:16px}
.txt small{display:block;font-style:italic;color:var(--muted);font-size:14px;margin-top:1px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.grid .opt{justify-content:flex-start}
.multihint{font-size:14px;color:var(--muted);margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:14px}
.rr{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr .k{font-size:14px;color:var(--muted);font-weight:500}
.rr .v{font-size:16px;margin-top:1px;overflow-wrap:anywhere}
.rr .v.none{color:var(--warn);background:var(--warn-bg);display:inline-block;padding:1px 8px;border-radius:4px;font-size:14px}
.rr .go{margin-left:auto;flex:none}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.done{text-align:center;padding-top:28px}
.done .lead{margin-bottom:12px}.done .send{color:var(--ink);font-weight:500;margin-bottom:20px}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
.done .tick::after{content:"";width:14px;height:26px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-3px)}
.fname{display:inline-block;font-variant-numeric:tabular-nums;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0 18px;overflow-wrap:anywhere}
.msg{font-size:14px;color:var(--muted);margin-top:14px}
.msg.err{color:var(--warn)}
footer.bar{display:none}
.navbar{display:flex;gap:10px;margin-top:24px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
footer.bar-old{flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.btn{min-height:52px;border-radius:10px;padding:0 14px;text-align:center;line-height:1.2;font-weight:700;font-size:17px;cursor:pointer;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.gauge>i{transition:none}}
@supports (height:100dvh){#app{height:100dvh}}
@media (max-width:480px){
  .brandrow{flex-direction:column;gap:8px}
  .brandrow .chip{position:static;transform:none}
  .brand{font-size:20px}
}
@media (max-width:340px){
  .brand{font-size:18px}
  .sector .nm{font-size:20px}
  main{padding-left:12px;padding-right:12px}
}
@media (max-height:700px){
  .brand{font-size:17px;margin-top:6px}
  .gauge{margin-top:6px}
  header.top{padding-top:8px;padding-bottom:8px}
  main{padding-top:14px}
}
@media (max-height:500px){
  .brand{display:none}
  .brandrow{flex-direction:row;gap:14px;justify-content:center}
  .brandrow .chip{position:static;transform:none}
  .gauge{margin-top:8px}
}

@supports (padding:max(0px)){
  header.top{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
}

</style>
</head>

function buildSteps(){
  steps=[{t:'identite',name:'Identité'},{t:'quand',name:'Date et heure'},{t:'profil',name:'Profil du marin'}];
  sec().rubriques.forEach(r=>steps.push({t:'rub',r,name:r.title}));
  steps.push({t:'recap',name:'Récapitulatif'});
}
function selOf(key){return S.sel[key]||(S.sel[key]=[])}
function selLabels(r){
  const out=[];
  r.sections.forEach(s=>{(S.sel[s.key]||[]).slice().sort((a,b)=>a-b).forEach(i=>out.push((s.title&&r.sections.length>1?s.title+' : ':'')+s.items[i].l))});

}

const TITLE='<div class="brand" role="heading" aria-level="1">Questionnaire sur les circonstances des accidents du travail maritime</div>';
function header(){
  const h=$('hdr');
  if(S.step<0){h.innerHTML='<div class="brandrow">'+LOGOS+'</div>'+TITLE;return}
  const n=steps.length, i=S.done?n-1:S.step, pct=S.done?100:Math.round(i/(n-1)*100);
  h.innerHTML='<div class="brandrow">'+LOGOS+'<span class="chip">'+esc(sec().name)+'</span></div>'+TITLE
   +'<div class="gauge" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Progression du questionnaire"><i style="width:'+pct+'%"></i></div>'
   +'<div class="gaugelabel"><span>'+(S.done?'PDF prêt':'Étape '+(i+1)+' / '+n+' · '+esc(steps[i].name))+'</span><span>'+pct+' %</span></div>';
}
function optHtml(type,name,idx,item,checked){
  return '<label class="opt'+(type==='radio'?' radio':'')+'"><input type="'+type+'" name="'+name+'" value="'+idx+'"'+(checked?' checked':'')+'><span class="box"></span>'
   +(item.n&&/^\d+$/.test(item.n)?'<span class="num">'+item.n+'</span>':'')+'<span class="txt">'+esc(item.l)+(item.note?'<small>'+esc(item.note)+'</small>':'')+'</span></label>';
}
function screen(){
  const m=$('main'); let html='', fb='';
  const prev='<button class="btn ghost" data-act="prev" aria-label="Étape précédente">Précédent</button>';
  if(S.step<0){
    html='<p class="lead intro">À joindre au rapport de blessure, maladie ou décès (imprimé RPM/102). Les réponses restent sur votre appareil, le PDF est créé ici.</p>'
     +'<h1 class="oneline" id="q1">Dans quel secteur maritime a eu lieu l’accident ?</h1><div class="stack">'
     +Object.values(DATA).map(d=>'<button class="sector" data-sector="'+d.id+'"><span><span class="nm">'+esc(d.name)+'</span><div class="ds">'+(d.rubriques.length+4)+' étapes</div></span>'+ARROW+'</button>').join('')+'</div>';
    fb='';
  } else if(S.done){
    const fn=S.done.name;
    html='<div class="done"><div class="tick" aria-hidden="true"></div><h2>Votre QCATM est prêt</h2><p class="lead">Votre questionnaire sur les circonstances des accidents du travail maritime (QCATM) est prêt à être téléchargé en PDF.</p><p class="lead send">Une fois téléchargé, adressez-le à l’Enim par voie postale (3bd Cosmao Dumanoir, 56100 Lorient) ou par mail (qcatm@enim.eu).</p><div class="fname">'+esc(fn)+'</div>'
      +(downloads===null?'<p class="msg err">Le téléchargement n’est pas disponible dans cette vue. Ouvrez la page dans le navigateur de votre téléphone ou de votre ordinateur.</p>':'')
      +'<p class="msg'+(S.err?' err':'')+'" id="dlmsg">'+esc(S.err)+'</p></div>';
    fb='<button class="btn ghost" data-act="back-recap">Modifier</button><button class="btn primary" data-act="download"'+(downloads===null?' disabled':'')+'>Télécharger votre QCATM</button>';
  } else {
    const st=steps[S.step];
    if(st.t==='identite'){
      html='<div class="eyebrow">Identité</div><h2>Qui est le marin concerné ?</h2><div style="height:14px"></div>'
       +'<div class="field"><label for="nom">Nom, prénom du marin</label><input type="text" id="nom" autocomplete="off" autocapitalize="words" value="'+esc(S.nom)+'"></div>'
       +'<div class="field"><label for="numero">Numéro</label><input type="text" id="numero" inputmode="numeric" autocomplete="off" placeholder="9 chiffres" value="'+esc(S.numero)+'"><span class="hint">Chiffres uniquement, 9 au maximum.</span></div>';
    } else if(st.t==='quand'){
      html='<div class="eyebrow">Accident</div><h2>Quand l’accident a-t-il eu lieu ?</h2><div style="height:14px"></div>'
       +'<div class="field"><label for="date">Date de l’accident</label><input type="date" id="date" max="'+today()+'" value="'+esc(S.date)+'"><button class="linkbtn" data-act="today" type="button">Aujourd’hui</button></div>'
       +'<div class="field"><label for="heure">Heure</label><input type="time" id="heure" value="'+esc(S.heure)+'"></div>';
    } else if(st.t==='profil'){
      html='<div class="eyebrow">Marin</div><h2>Profil du marin</h2><div style="height:14px"></div>'
       +'<div class="legend" style="margin-bottom:8px">Sexe du marin</div><div class="opts grid">'
       +sec().sexe.map((b,i)=>optHtml('radio','sexe',i,{l:b.l==='H'?'Homme (H)':'Femme (F)'},S.sexe===i)).join('')+'</div>'
       +'<div class="legend" style="margin:22px 0 8px">Tranche d’âge</div><div class="opts grid">'
       +sec().age.map((b,i)=>optHtml('radio','age',i,{l:b.l},S.age===i)).join('')+'</div>';
    } else if(st.t==='rub'){
      const r=st.r;
      html='<div class="eyebrow">Circonstances</div><h2>'+esc(r.title)+'</h2>'+(r.sub?'<p class="sub">'+esc(r.sub)+'</p>':'')+'<p class="multihint">Plusieurs réponses possibles.</p>'
       +r.sections.map(s=>(s.title?'<div class="sectitle">'+esc(s.title)+'</div>':'')+'<div class="opts" data-key="'+s.key+'">'+s.items.map((it,i)=>optHtml('checkbox',s.key,i,it,(S.sel[s.key]||[]).includes(i))).join('')+'</div>').join('');
    } else if(st.t==='recap'){
      const rows=[];
      rows.push(['Nom, prénom',S.nom,0]);rows.push(['Numéro',S.numero,0]);
      rows.push(['Date de l’accident',fmtDate(S.date),1]);rows.push(['Heure',S.heure,1]);
      rows.push(['Sexe',S.sexe==null?'':(sec().sexe[S.sexe].l==='H'?'Homme (H)':'Femme (F)'),2]);
      rows.push(['Tranche d’âge',S.age==null?'':sec().age[S.age].l,2]);
      sec().rubriques.forEach((r,k)=>rows.push([r.title,selLabels(r).join(' · '),3+k]));
      const miss=rows.filter(r=>!r[1]).length;
      html='<div class="eyebrow">Dernière étape</div><h2>Vérifiez vos réponses</h2><p class="lead" style="margin-bottom:14px">Touchez « Modifier » pour corriger une rubrique.</p>'
       +(miss?'<div class="banner">'+miss+' rubrique'+(miss>1?'s':'')+' non renseignée'+(miss>1?'s':'')+'. Vous pouvez valider ainsi, ces cases resteront vides dans le PDF.</div>':'')
       +'<div class="card">'+rows.map(r=>'<div class="rr"><div><div class="k">'+esc(r[0])+'</div><div class="v'+(r[1]?'':' none')+'">'+(r[1]?esc(r[1]):'Non renseigné')+'</div></div><button class="linkbtn go" data-goto="'+r[2]+'">Modifier</button></div>').join('')+'</div>';
    }
    const last=S.step===steps.length-1;
    fb=prev+(last?'<button class="btn primary" data-act="validate"'+(S.busy?' disabled':'')+'>'+(S.busy?'Création du PDF…':'Valider')+'</button>'
        :'<button class="btn primary" data-act="next">'+(S.step===steps.length-2?'Voir le récapitulatif':'Suivant')+'</button>');
  }
  m.innerHTML=html+(fb?'<div class="navbar" id="ftr">'+fb+'</div>':'');
}
function fit(){const h=$('q1');if(!h)return;h.style.whiteSpace='nowrap';let s=24;h.style.fontSize=s+'px';while(s>15&&h.scrollWidth>h.clientWidth){s-=.5;h.style.fontSize=s+'px'} if(h.scrollWidth>h.clientWidth){h.style.whiteSpace='normal';h.style.fontSize='19px'}}
function render(keepScroll){header();screen();fit();if(!keepScroll){$('main').scrollTop=0}}
window.addEventListener('resize',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sector],[data-act],[data-goto]'); if(!t)return;
  if(t.dataset.sector){
    if(S.sector&&S.sector!==t.dataset.sector){S.sel={}}
    S.sector=t.dataset.sector;S.done=null;buildSteps();S.step=0;render();return}
  if(t.dataset.goto!==undefined){S.step=+t.dataset.goto;S.done=null;render();return}
  const a=t.dataset.act;
  if(a==='next'){S.step=Math.min(S.step+1,steps.length-1);render()}
  else if(a==='prev'){if(S.step===0){S.step=-1}else S.step--;render()}
  else if(a==='today'){S.date=today();const d=$('date');if(d)d.value=S.date}
  else if(a==='back-recap'){S.done=null;S.step=steps.length-1;render()}
  else if(a==='validate')validate();
  else if(a==='download')download();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nom')S.nom=t.value;
  else if(t.id==='numero'){const v=t.value.replace(/\D/g,'').slice(0,9);if(v!==t.value)t.value=v;S.numero=v}
  else if(t.id==='date')S.date=t.value;
  else if(t.id==='heure')S.heure=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.tagName!=='INPUT'||!t.name)return;
  if(t.name==='sexe')S.sexe=+t.value;
  else if(t.name==='age')S.age=+t.value;
  else if(t.type==='checkbox'){const a=selOf(t.name),v=+t.value,i=a.indexOf(v);if(t.checked&&i<0)a.push(v);if(!t.checked&&i>=0)a.splice(i,1)}
});

/* ---------- PDF ---------- */
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function makePdf(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib; const d=sec();
  const doc=await PDFDocument.load(b64(PDFS[S.sector])); const page=doc.getPages()[0];
  const font=await doc.embedFont(StandardFonts.Helvetica);
  const W=page.getWidth(),H=page.getHeight(),K=W/794; const ink=rgb(.04,.08,.35);
  const ok=s=>String(s).split('').filter(c=>{try{font.widthOfTextAtSize(c,10);return true}catch(_){return false}}).join('');
  const X=(b)=>{const p=2.3,x1=b.x+p,x2=b.x+b.w-p,y1=b.y+p,y2=b.y+b.h-p;
    const L=(ax,ay,bx,by)=>page.drawLine({start:{x:ax*K,y:H-ay*K},end:{x:bx*K,y:H-by*K},thickness:1.5,color:ink});
    L(x1,y1,x2,y2);L(x1,y2,x2,y1)};
  const comb=(c,str)=>{const pitch=(c.w-1)/c.n;[...String(str)].slice(0,c.n).forEach((ch,i)=>{
    const w=font.widthOfTextAtSize(ch,11);const cx=c.x+.5+pitch*(i+.5);
    page.drawText(ch,{x:cx*K-w/2,y:H-(c.y+c.h-4.5)*K,size:11,font,color:ink})})};
  const f=d.f;
  if(S.nom.trim()){let t=ok(S.nom.trim()),sz=11;while(sz>6&&font.widthOfTextAtSize(t,sz)>(f.nom.w-6)*K)sz-=.5;
    page.drawText(t,{x:(f.nom.x+3)*K,y:H-(f.nom.y+f.nom.h-3)*K,size:sz,font,color:ink})}
  if(S.numero)comb(f.num,S.numero);
  if(S.date){const[a,b,c]=S.date.split('-');comb(f.jj,c);comb(f.mm,b);comb(f.aaaa,a)}
  if(S.heure){const[h,m]=S.heure.split(':');comb(f.hh,h);comb(f.mn,m)}
  if(S.sexe!=null)X(d.sexe[S.sexe]);
  if(S.age!=null)X(d.age[S.age]);
  d.rubriques.forEach(r=>r.sections.forEach(s=>(S.sel[s.key]||[]).forEach(i=>X(s.items[i]))));
  doc.setTitle('QCATM – '+d.title);doc.setAuthor('Questionnaire rempli sur mobile');
  return await doc.save();
}
function fileName(){const d=sec();return today()+' QCATM_'+d.name.replace(/\s+/g,'-').normalize('NFD').replace(/[̀-ͯ]/g,'')+'.pdf'}
async function validate(){
  if(S.busy)return;S.busy=true;S.err='';render(true);
  try{ if(!window.PDFLib)throw new Error('lib'); const bytes=await makePdf(); S.done={bytes,name:fileName()}; }
  catch(e){S.err='Le PDF n’a pas pu être créé. Vérifiez votre connexion puis réessayez.'; S.done=null; S.busy=false; render(true); const m=$('main'); (function(){const nb=$('ftr'),p='<p class="msg err">'+esc(S.err)+'</p>';nb?nb.insertAdjacentHTML('beforebegin',p):m.insertAdjacentHTML('beforeend',p)})(); return}
  S.busy=false;render();
}
async function download(){
  if(!S.done)return; S.err='';
  try{ await downloads.save({filename:S.done.name,data:S.done.bytes.slice()}); const m=$('dlmsg'); if(m){m.className='msg';m.textContent='Fichier enregistré.'} }
  catch(e){ const m=$('dlmsg'); const c=e&&e.code; const t=c==='declined'?'Téléchargement annulé. Touchez le bouton pour réessayer.':'Le téléchargement a échoué. Réessayez dans un instant.'; if(m){m.className='msg err';m.textContent=t} }
}
(async()=>{ try{ downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null }catch(_){downloads=null} if(!downloads){downloads={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return{status:'saved'}}}} if(S.done)render(true) })();
render();
</script>
